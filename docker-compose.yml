name: daw_ut3_p3

services:
  nginx:
    image: nginx:alpine
    container_name: alumnos-nginx
    ports:
      - "8009:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: alumnos-php
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: miapp
      DB_USER: miapp_user
      DB_PASSWORD: miapp_pass
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: alumnos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: miapp
      MYSQL_USER: miapp_user
      MYSQL_PASSWORD: miapp_pass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
